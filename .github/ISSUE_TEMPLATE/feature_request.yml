name: Feature request
description: Propose a new capability or a change to an existing one.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today? Your compliance, fraud or incident-response context helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Describe the behaviour, not only the screen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core (engine, analysis, providers)
        - Labels
        - Server / API
        - CLI
        - Web UI
        - Docs
