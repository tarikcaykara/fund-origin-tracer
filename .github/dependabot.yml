# Weekly version-update PRs; minor and patch updates are grouped per ecosystem, majors come one by one.
# The Bun runtime (Dockerfile image, ci.yml bun-version, @types/bun) is bumped by hand, all together:
# see "Dependencies" in CONTRIBUTING.md. That is why @types/bun is ignored and the docker ecosystem is absent.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [infra]
    commit-message:
      prefix: build
      include: scope
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/bun"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [infra]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
