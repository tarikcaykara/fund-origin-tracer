name: CI
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  # gitleaks-action lists a pull request's commits through the API on pull_request events.
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Fails on a moderate or higher advisory in any locked package, dev tools included. Accept a
      # reviewed advisory with `--ignore=<GHSA id>` and a comment saying why it does not apply.
      - run: bun audit --audit-level=moderate
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Playwright Test runs under Node; bun runs the server and the build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps --only-shell chromium
        working-directory: apps/web
      - run: bun run smoke
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: apps/web/smoke/test-results
          retention-days: 7
