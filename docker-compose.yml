name: fund-origin-tracer
services:
  fot:
    build: .
    image: fund-origin-tracer:${FOT_VERSION:-local}
    env_file: .env
    environment:
      # Fixed inside the container; .env values for these would break the port mapping, the
      # volume and the bind (.env.example sets HOST=127.0.0.1, unreachable through the port).
      PORT: "3000"
      DATA_DIR: /app/data
      HOST: "0.0.0.0"
    init: true
    restart: unless-stopped
    ports:
      # Loopback only; see the README for LAN access.
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - data:/app/data
    # Bounded logs for long-running hosts.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data:
